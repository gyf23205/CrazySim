# python scripts/skrl/train.py --env_id CrazySim-TrackingWaypoint-Direct-v0 --tasks square circle triangle figure8 --method kae_moe --headless --seed 42 --run_name crl_cmp env.trajectory_laps=1 --max_iterations 500

