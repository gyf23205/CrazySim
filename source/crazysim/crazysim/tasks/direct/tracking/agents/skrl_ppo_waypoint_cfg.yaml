# python scripts/skrl/train.py --env_id CrazySim-TrackingWaypoint-Direct-v0 --tasks square --method scratch --headless --no_eval --warm_start --max_iterations 500 env.trajectory_laps=1 

# 2. SQUARE=logs/skrl/crazyflie_tracking_waypoint/2026-11-12_17-11-32_scratch_square 

# 3. FAME 
# python scripts/skrl/train.py --env_id CrazySim-TrackingWaypoint-Direct-v0 --tasks circle triangle figure8 --method fame --headless --no_eval --max_iterations 500 env.trajectory_laps=1 --resume $SQUARE

# 4. KAE-MoE
# python scripts/skrl/train.py --env_id CrazySim-TrackingWaypoint-Direct-v0 --tasks circle triangle figure8 --method kae_moe --headless --no_eval --max_iterations 500 env.trajectory_laps=1 --resume $SQUARE



# Same models as the scratch PPO of Drone_Test_TRO (BoundedScratchPolicy, BoundedValue): tanh-squashed Gaussian
# policy with a state-independent noise, separate value network, running normalization of the observations.
models:
  separate: True
  policy:
    class: SquashedGaussian
    initial_log_std: 0.0
    min_log_std: -3.0  # keeps the noise std before the tanh >= 0.05; BoundedScratchPolicy has no floor
    network:
      - name: net
        input: STATES
        layers: [64, 64]
        activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: False
    network:
      - name: net
        input: STATES
        layers: [64, 64]
        activations: elu
    output: ONE

memory:
  class: RandomMemory
  memory_size: -1

# Equal to build_setpoint_skrl_config of Drone_Test_TRO, except rollouts, learning rate and its scheduler: that
# configuration collects 800 steps of one drone per update, this one 96 steps of each of 4096 environments.
agent:
  class: PPO
  rollouts: 96
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 5.0e-04
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
    max_lr: 1.0e-03
  state_preprocessor: null  # no observation normalization for any method (fame's meta learner included)
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: True
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.01
  time_limit_bootstrap: False
  experiment:
    directory: "crazyflie_tracking_waypoint"
    experiment_name: ""
    write_interval: auto
    checkpoint_interval: 96  # every iteration (= rollouts); scripts/skrl/train.py sets it to rollouts

trainer:
  class: SequentialTrainer
  timesteps: 48000  # 500 iterations
  environment_info: log

# KAE of scripts/skrl/fit_kae.py. Drone_Test_TRO loads KAEs with hidden size 64 whose input is the observation
# plus one constant column: padded_dim = 56 + 1.
kae:
  padded_dim: 57
  observable_dim: 16
  p: 1
  observation_samples: 30000
  hidden_dim: 64
  sample_count: 15000
  batch_size: 2048
  epochs: 7500
  learning_rate: 1.0e-04
  kae_coefficient: 0.1
  action_coefficient: 0.9
  seed: 777

# Settings of the transfer methods (scripts/skrl/train.py --method <name>); see skrl_ppo_cfg.yaml.
# Observation normalization is off for every method (agent.state_preprocessor: null above). residual, componet and
# kae_moe require it off: they run frozen policies of earlier tasks on raw observations.
# Their network sizes follow the policy above ([64, 64]); kae_moe's KAE settings follow kae: above.
methods:
  residual:
    hidden_dims: [64, 64]  # residual network
  componet:
    internal_hidden_dims: [64, 64]  # internal policy; the first entry is also the attention dimension
  kae_moe:
    padded_dim: 57  # observations and actions are padded with ones to this size before the KAE (>= observation size)
    observable_dim: 16  # KAE latent size = experts per KAE
    p: 1  # power of the Koopman operator in the expert outputs
    residual_hidden_dims: [64, 64]  # MLP pathway
    weight_hidden_dims: [32]  # per-KAE mode-weight networks
    # router between KAEs. [128] on master; [64, 32] as the tracking configuration since master 95b040f.
    # Drone_Test_TRO builds the same router (examples/MoE.py)
    router_hidden_dims: [64, 32]
    gating_hidden_dims: [32]  # gate between the KAE and MLP pathways
    kae:
      observation_samples: 30000  # observations recorded after training to fit the sampling distribution
      hidden_dim: 64
      sample_count: 15000
      batch_size: 2048
      epochs: 7500
      learning_rate: 1.0e-04
      kae_coefficient: 0.1
      action_coefficient: 0.9
      seed: 777
  fame:  # fast learner: the PPO agent above (models: and agent:); these are the meta-learner settings
    size_fast2meta: 100000  # states of the current task visited by its best fast learner, used for distillation
    size_meta: 500000  # states of earlier tasks
    detection_steps: null  # steps per candidate when choosing the initial policy of a task; null: one episode
    lr_meta: 1.0e-03
    meta_batch_size: 4096
    epoch_meta: 200
    meta_lr_scheduler_gamma: 0.95
