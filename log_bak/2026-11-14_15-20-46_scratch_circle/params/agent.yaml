seed: 42
models:
  separate: true
  policy:
    class: SquashedGaussian
    initial_log_std: 0.0
    min_log_std: -3.0
    network:
    - name: net
      input: STATES
      layers:
      - 64
      - 64
      activations: elu
    output: ACTIONS
  value:
    class: DeterministicMixin
    clip_actions: false
    network:
    - name: net
      input: STATES
      layers:
      - 64
      - 64
      activations: elu
    output: ONE
memory:
  class: RandomMemory
  memory_size: -1
agent:
  class: PPO
  rollouts: 96
  learning_epochs: 5
  mini_batches: 4
  discount_factor: 0.99
  lambda: 0.95
  learning_rate: 0.0005
  learning_rate_scheduler: KLAdaptiveLR
  learning_rate_scheduler_kwargs:
    kl_threshold: 0.016
    max_lr: 0.001
  state_preprocessor: RunningStandardScaler
  state_preprocessor_kwargs: null
  value_preprocessor: RunningStandardScaler
  value_preprocessor_kwargs: null
  random_timesteps: 0
  learning_starts: 0
  grad_norm_clip: 1.0
  ratio_clip: 0.2
  value_clip: 0.2
  clip_predicted_values: true
  entropy_loss_scale: 0.0
  value_loss_scale: 1.0
  kl_threshold: 0.0
  rewards_shaper_scale: 0.01
  time_limit_bootstrap: false
  experiment:
    directory: crazyflie_tracking_waypoint
    experiment_name: ''
    write_interval: auto
    checkpoint_interval: 1920
trainer:
  class: SequentialTrainer
  timesteps: 48000
  environment_info: log
  close_environment_at_exit: false
kae:
  padded_dim: 57
  observable_dim: 16
  p: 1
  observation_samples: 30000
  hidden_dim: 64
  sample_count: 15000
  batch_size: 1024
  epochs: 7500
  learning_rate: 0.0001
  kae_coefficient: 0.1
  action_coefficient: 0.9
  seed: 777
methods:
  residual:
    hidden_dims:
    - 256
    - 128
    - 64
  componet:
    internal_hidden_dims:
    - 256
    - 128
    - 64
  kae_moe:
    padded_dim: 57
    observable_dim: 8
    p: 1
    residual_hidden_dims:
    - 256
    - 128
    - 64
    weight_hidden_dims:
    - 32
    router_hidden_dims:
    - 64
    gating_hidden_dims:
    - 32
    kae:
      observation_samples: 30000
      hidden_dim: 64
      sample_count: 15000
      batch_size: 1024
      epochs: 7500
      learning_rate: 0.0001
      kae_coefficient: 0.1
      action_coefficient: 0.9
      seed: 777
  fame:
    hidden_dims:
    - 256
    - 128
    - 64
    lr_actor: 0.0003
    lr_critic: 0.001
    lr_meta: 0.001
    gamma: 0.99
    gae_lambda: 0.95
    clip_ratio: 0.2
    value_coef: 1.0
    grad_norm_clip: 1.0
    init_temperature: 0.1
    alpha_lr: 0.0001
    target_entropy: null
    ppo_epochs: 5
    num_mini_batches: 4
    mini_batch_size: 1024
    rewards_shaper_scale: 1.0
    size_fast2meta: 100000
    size_meta: 500000
    detection_steps: 1000
    epoch_meta: 200
    meta_lr_scheduler_gamma: 0.95
